# ArduPilot-structured baseline controller (QuadPlane). EDIT THIS FILE.
# Names in the `ardupilot` group are the real ArduPilot parameter names. Gains in the other
# groups are ASSUMED structure/values until SITL or flight logs calibrate them.

ardupilot:
  AIRSPEED_MIN: {value: 17.0, unit: "m/s", source: "transition speed, read as EQUIVALENT airspeed (O-14: the forward transition ends when EAS > AIRSPEED_MIN; O-23: the AIRBRAKE exit uses EAS too). 17.0 EAS = 1.26 x stall at nominal mass (stall 13.52 m/s EAS: m 26.664 kg, S 1.617, model CL_max 1.444) and 1.17 x at mass x1.15 (stall 14.50). Same margin at every altitude; CL_max is provisional (vehicle.yaml alpha_s). Value kept from the earlier TAS reading; to be revisited by analysis FT", status: TBD}
  Q_TRANSITION_MS: {value: 5000.0, unit: "ms", source: "(DEFAULT ARDU VALUE) Plane docs default 5000", status: documented}
  Q_BACKTRANS_MS: {value: 3000.0, unit: "ms", source: "(DEFAULT ARDU VALUE) pitch-limit ramp time on back-transition", status: TBD}
  Q_A_ANGLE_MAX: {value: 30.0, unit: "deg", source: "(DEFAULT ARDU VALUE) max VTOL lean angle", status: TBD}
  # Q_BCK_PIT_LIM: omit for no cap, or add {value, unit, source, status}
  TKOFF_THR_MAX: {value: 0.8, unit: "-", source: "(DEFAULT ARDU VALUE) pusher throttle in AUTO during the forward transition", status: TBD}
  Q_TRANS_FAIL: {value: 0.0, unit: "ms", source: "(DEFAULT ARDU VALUE) 0 disables the stuck-transition timeout (documented)", status: documented}
  Q_M_SPIN_MIN: {value: 0.1, unit: "-", source: "rotor throttle floor in altitude hold; set above the ESC dead zone", status: TBD}
  Q_M_SPIN_MAX: {value: 0.95, unit: "-", source: "rotor throttle ceiling", status: TBD}
  PTCH_LIM_MAX_DEG: {value: 20.0, unit: "deg", source: "(DEFAULT ARDU VALUE) PITCH_MAX 20 in ArduPlane/config.h, used by Parameters.cpp PTCH_LIM_MAX_DEG, Plane-4.7.2; fixed in analysis C, not searched (owner decision 2026-10-28)", status: TBD}
  Q_TRAN_PIT_MAX: {value: 3.0, unit: "deg", source: "(DEFAULT ARDU VALUE) pitch cap in the forward transition; the fade cap is (Q_TRAN_PIT_MAX + 1) x 2 (O-16)", status: TBD}
  TKOFF_THR_MIN: {value: 0.0, unit: "-", source: "(DEFAULT ARDU VALUE) 0 = use TRIM_THROTTLE as the pusher minimum in the forward transition (O-17)", status: TBD}
  TRIM_THROTTLE: {value: 0.45, unit: "-", source: "(DEFAULT ARDU VALUE) THROTTLE_CRUISE 45 percent (config.h). Set to the flown value: it is the pusher minimum during the forward transition and the TECS feed-forward", status: TBD}
  THR_MIN: {value: 0.0, unit: "-", source: "(DEFAULT ARDU VALUE)", status: TBD}
  THR_MAX: {value: 1.0, unit: "-", source: "(DEFAULT ARDU VALUE)", status: TBD}
  THR_SLEWRATE: {value: 100.0, unit: "%/s", source: "(DEFAULT ARDU VALUE)", status: TBD}
  PTCH_LIM_MIN_DEG: {value: -25.0, unit: "deg", source: "ArduPilot default as remembered; not re-read from source. Check", status: TBD}
  # Q_TRANS_DECEL: normally an ANALYSIS OUTPUT (analysis D). Add it only to fix the planner
  # value used when an analysis does not compute it.

tecs:            # TECS defaults for the forward-transition model (analysis FT, docs/FT_spec.md 4.4; O-19, O-22)
  TECS_TIME_CONST: {value: 5.0, unit: "s", source: "(DEFAULT ARDU VALUE)", status: TBD}
  TECS_THR_DAMP:   {value: 0.5, unit: "s", source: "(DEFAULT ARDU VALUE)", status: TBD}
  TECS_INTEG_GAIN: {value: 0.3, unit: "-", source: "(DEFAULT ARDU VALUE)", status: TBD}
  TECS_VERT_ACC:   {value: 7.0, unit: "m/s^2", source: "(DEFAULT ARDU VALUE)", status: TBD}
  TECS_PTCH_DAMP:  {value: 0.3, unit: "s", source: "(DEFAULT ARDU VALUE)", status: TBD}
  TECS_CLMB_MAX:   {value: 5.0, unit: "m/s", source: "(DEFAULT ARDU VALUE)", status: TBD}
  TECS_SINK_MAX:   {value: 5.0, unit: "m/s", source: "(DEFAULT ARDU VALUE)", status: TBD}
  TECS_SINK_MIN:   {value: 2.0, unit: "m/s", source: "(DEFAULT ARDU VALUE)", status: TBD}
  TECS_PITCH_MAX:  {value: 15.0, unit: "deg", source: "(DEFAULT ARDU VALUE) 0 would use PTCH_LIM_MAX_DEG", status: TBD}

altitude_hold:   # rotor altitude hold, eq. 8.5 (gains assumed)
  K_h: {value: 0.5, unit: "s^-1", source: "altitude error to demanded climb rate", status: TBD}
  K_vh: {value: 0.02, unit: "s/m", source: "throttle per m/s of climb-rate error", status: TBD}
  K_i: {value: 0.01, unit: "m^-1", source: "integral gain: throttle per metre of accumulated altitude-rate error", status: TBD}
  v_dem_max: {value: 3.0, unit: "m/s", source: "climb-rate demand limit", status: TBD}
  i_max: {value: 20.0, unit: "m", source: "integral clamp", status: TBD}

position:        # position cascade, eq. 8.9 (open question O-11)
  K_p: {value: 0.5, unit: "s^-1", source: "position error to demanded speed (linear zone)", status: TBD}
  K_v: {value: 1.0, unit: "s^-1", source: "speed error to commanded deceleration", status: TBD}
  a_lim: {value: 3.0, unit: "m/s^2", source: "deceleration limit of the speed profile; what it is in Plane is open (O-11)", status: TBD}

cruise_stub:     # fixed-wing hold between the transitions
  v_cruise: {value: 22.5, unit: "m/s", source: "cruise speed target (true airspeed); 22.5 TAS at the 1500 m reference altitude = 20.9 EAS", status: TBD}
  r_tecs: {value: 0.5, unit: "s^-1", source: "pusher-command rate limit; TECS_THR_ERATE meaning open (O-10)", status: TBD}
  tau_h: {value: 1.0, unit: "s", source: "pusher hand-off time constant", status: TBD}
  K_s: {value: 0.05, unit: "s/m", source: "pusher command per m/s speed error", status: TBD}
  K_si: {value: 0.01, unit: "m^-1", source: "speed integral gain", status: TBD}
  K_hp: {value: 0.02, unit: "rad/m", source: "pitch per metre of altitude error", status: TBD}
  K_hd: {value: 0.03, unit: "rad*s/m", source: "pitch per m/s of climb rate", status: TBD}
  theta_cruise_max: {value: 0.15, unit: "rad", source: "cruise pitch limit", status: TBD}