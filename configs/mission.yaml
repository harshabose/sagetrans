# Mission, usable-energy window, reserves and descent limits. EDIT THIS FILE.
# Same format and status words as vehicle.yaml. TBD = placeholder (draft only).

profile:        # the idealised flight used by the energy budget (analysis E)
  climb_height_m: {value: 200.0, unit: "m", source: "climb above the airfield; cruise altitude = site + this (the sites are swept in study.yaml, E.sites_amsl_m)", status: TBD}
  isa_offset_k: {value: 0.0, unit: "K", source: "ISA temperature offset for the budget", status: TBD}
  clearance_agl_m: {value: 30.0, unit: "m", source: "hover climb before the forward transition; also the height above ground at which analysis FT starts", status: TBD}
  fwd_alt_loss_max_m: {value: 10.0, unit: "m", source: "largest altitude loss below the forward-transition start that is accepted; a failure beyond it (analysis FT). Set by the owner 2026-10-27: 30 m start, 10 m clearance, so the floor is 20 m AGL", status: assumed}
  fwd_alt_gain_max_m: {value: 10.0, unit: "m", source: "largest altitude gain above the forward-transition start that is accepted; a failure beyond it (analysis FT). Symmetric with the loss limit by default", status: assumed}
  vz_takeoff: {value: 2.0, unit: "m/s", source: "vertical climb rate in take-off", status: TBD}
  t_hover_pre: {value: 10.0, unit: "s", source: "hover on the pad before lift-off", status: TBD}
  a_fwd: {value: 1.5, unit: "m/s^2", source: "forward-transition acceleration; ASSUMED until analysis C", status: TBD}
  roc: {value: 2.5, unit: "m/s", source: "rate of climb", status: TBD}
  v_cruise: {value: 22.5, unit: "m/s", source: "design true airspeed at v_cruise_ref_amsl_m (22.5 TAS at 1500 m = 20.9 EAS); at any other altitude the TAS follows from the density (same dynamic pressure). Same as controller.cruise_stub.v_cruise", status: TBD}
  v_cruise_ref_amsl_m: {value: 1500.0, unit: "m", source: "altitude where the design speeds hold", status: TBD}
  payload_kg: {value: 5.0, unit: "kg", source: "mass delivered at the destination; the return leg flies at vehicle mass minus this (O-12; 1 - 5/26.664 = 0.8125, scenario S-06)", status: TBD}
  t_drop_s: {value: 0.0, unit: "s", source: "hover at the destination for the drop, at the loaded mass", status: TBD}
  # v_climb, v_glide: omit to use the cruise speed, or add {value, unit, source, status} (design TAS at v_cruise_ref_amsl_m)
  h_bt_agl_m: {value: 30.0, unit: "m", source: "height above ground where the back-transition starts", status: TBD}
  soc_mean: {value: 0.6, unit: "-", source: "one mean state of charge used for all segment powers (the mean of the trace, 1.0 to 0.2)", status: TBD}
  t_go_around: {value: 60.0, unit: "s", source: "go-around hover time (reserve)", status: TBD}
  t_hold: {value: 0.0, unit: "s", source: "hold at the landing zone (reserve)", status: TBD}
  d_diversion_m: {value: 5000.0, unit: "m", source: "diversion distance (reserve)", status: TBD}
  n_diversion_transitions: {value: 0, unit: "-", source: "extra forward+back transition pairs", status: TBD}

battery_window:  # usable energy = eta_usable * soh * temp_factor * nominal energy (O-15)
  eta_usable: {value: 0.8, unit: "-", source: "usable fraction of nominal energy; BMS and cut-off limits", status: TBD}
  soh: {value: 1.0, unit: "-", source: "state of health (1 = new)", status: TBD}
  temp_factor: {value: 1.0, unit: "-", source: "temperature derating (1 = 25 degC)", status: TBD}
  soc_start: {value: 1.0, unit: "-", source: "state of charge at take-off (a full pack); the usable energy is eta_usable of nominal, so the mission ends at 1 - eta_usable", status: TBD}
  soc_eod: {value: 0.1, unit: "-", source: "state of charge at end of discharge, for the hover power check", status: TBD}

descent:         # analysis F
  kappa: {value: 0.23, unit: "-", source: "Johnson, NASA/TP-2005-213477, Yeates test data: observable vortex ring state from Vz/vh = -0.23 near zero forward speed (the most conservative onset reported; Drees roughness -0.62 to -1.53, inflow instability -0.5 to -1.5). Read from a summary of the report: confirm against the PDF before quoting", status: documented}
  v_fragility: {value: 3.0, unit: "m/s", source: "payload-fragility descent-rate limit; never binds while the vortex-ring cap (1.5 to 2.4 m/s over the scenarios) is lower; confirm with payload data", status: TBD}
  # v_sensor: omit for none, or add {value, unit, source, status} (rangefinder limit)
  h_slow: {value: 6.0, unit: "m", source: "below this height the descent slows to v_final; set to the ArduPilot Q_LAND_FINAL_ALT default", status: assumed}
  v_final: {value: 0.5, unit: "m/s", source: "final descent rate; set to the ArduPilot Q_LAND_FINAL_SPD default; rangefinder and ground effect", status: assumed}

requirements:    # the distances flown the budget is checked against (a round trip of 100 km is a 50 km radius)
  range_primary_km: {value: 100.0, unit: "km", source: "specified range requirement", status: stated}
  range_p95_km: {value: 120.0, unit: "km", source: "about 113 km needed for the 95th-percentile mission", status: stated}
