# Vehicle parameter register. EDIT THIS FILE with real data.
#
# Every entry: value, unit, source, status. Units are converted to SI once, on load, so
# write them in whatever unit is natural (kg, mm, deg, rpm, Ah ...).
# status is one of: measured | datasheet | derived | documented | stated | assumed | TBD
#
# The values below are PLACEHOLDERS: illustrative numbers for a notional 8 kg 4+1 VTOL,
# not Sage's data, and so every one is marked TBD. In 'draft' mode (the default) a TBD
# entry is used as written and the whole run is labelled DRAFT; in 'release' mode any TBD
# entry is refused. Replace a value, set its unit/source, and change TBD to measured,
# datasheet, ... once it is real. An entry left out (or with no value) falls back to the
# built-in placeholder in draft mode and is refused in release mode.

# Total take-off mass. What does '5 kg' mean (payload or MTOW)? Open question O-12.
mass:
  m: {value: 26.664, unit: "kg", source: "from sage excel sheet", status: derived}

# Wing: area, linear lift, stall and drag. Flat-plate post-stall model.
wing:
  S: {value: 1.617, unit: "m^2", source: "aircraft parameter sheet (note: b x MAC = 1.605 m^2, 0.7% off)", status: stated}
  CL0: {value: 0.4, unit: "-", source: "CFD (half-model, doubled): linear fit CL vs alpha, 0-10 deg; raw 0.376 at 0 deg; AoA reference to confirm", status: derived}
  CL_alpha: {value: 4.75, unit: "rad^-1", source: "CFD linear fit 0-10 deg (lifting-line estimate 5.0-5.2)", status: derived}
  alpha_s: {value: 0.274, unit: "rad", source: "PROVISIONAL: chosen for a CL_max of about 1.5 (parameter sheet, not supported by CFD, which has no peak up to 15 deg). The model's CL_max is 1.444, not 1.5: the stall-blend sharpness M went from 100 to 70 on 2026-10-14 and that lowered the peak; alpha_s and M are unchanged, the owner decides whether to re-tune. Needs CFD at 16-24 deg", status: assumed}
  # CD0 PLACEHOLDER (2026-10-14): doubled from the wing-only CFD value 0.033 to stand in for
  # whole-aircraft drag (fuselage, booms, rotors, gear). REPLACE with the CFD value when available; re-run A and D afterwards.
  CD0: {value: 0.066, unit: "-", source: "ASSUMED: 2 x 0.033 (wing-only CFD symmetric fit CD = CD0 + k CL^2, 0-10 deg) as a stand-in for whole-aircraft CD0; replace with whole-aircraft CFD", status: assumed}
  k: {value: 0.042, unit: "-", source: "CFD fit 0-10 deg; agrees with Raymer straight-wing K = 0.0405 (not the swept-wing 0.0631)", status: derived}
  CN: {value: 1.5, unit: "-", source: "flat-plate normal-force coefficient (Cory and Tedrake 1.2 to 2); sourced or measured value needed", status: TBD}
  i_w: {value: 0.0, unit: "rad", source: "wing incidence relative to the body x-axis", status: derived}
  M: {value: 70.0, unit: "rad^-1", source: "stall-blend sharpness: a NUMERICAL parameter, not physical; was 100 (needed for T-02), set to 70 on 2026-10-14; re-check T-02 and the A thrust_sign window", status: TBD}


# Four lift rotors (identical in the point-mass model), polynomial maps.
rotor:
  n_r: {value: 4, unit: "-", source: "4+1 configuration (stated)", status: stated}
  D: {value: 762, unit: "mm", source: "VT 3010 CFRP_FP propeller (30 in)", status: datasheet}
  I_rot: {value: 0.0015, unit: "kg*m^2", source: "rotor + motor inertia; sets spool-up", status: TBD}
  CT0: {value: 0.0928, unit: "-", source: "constant CT = T/(rho n^2 D^4), VT3010 CFRP_FP on 8020 PRO, mean of 50-80% throttle rows (2343-3475 rpm), rho = 1.225 assumed; spread 0.0896-0.0951; 0.0855 at 95%", status: derived}
  CT1: {value: 0.0, unit: "-", source: "J dependence removed by decision (no data); constant-CT idealisation", status: assumed}
  CT2: {value: 0.0, unit: "-", source: "J dependence removed by decision", status: assumed}
  CQ0: {value: 0.005, unit: "-", source: "constant CQ = Q/(rho n^2 D^5), same rows and density; spread 0.00476-0.00521", status: derived}
  CQ1: {value: 0.0, unit: "-", source: "J dependence removed by decision", status: assumed}
  CQ2: {value: 0.0, unit: "-", source: "J dependence removed by decision", status: assumed}
  CH1: {value: 0.0, unit: "-", source: "in-plane (H) force removed by decision", status: assumed}
  k_mu: {value: 0.0, unit: "-", source: "edgewise-flow thrust/torque factor removed by decision", status: assumed}
  J_min: {value: -0.5, unit: "-", source: "INERT while CT1=CT2=CQ1=CQ2=0 (J removed); kept so the map stays valid if J is restored", status: assumed}
  J_max: {value: 1.0, unit: "-", source: "INERT while CT1=CT2=CQ1=CQ2=0 (J removed)", status: assumed}
  mu_max: {value: 1.0, unit: "-", source: "INERT while k_mu=CH1=0 (edgewise terms removed)", status: assumed}
  omega_floor: {value: 1.0, unit: "rad/s", source: "NUMERICAL guard, keep > 0: it stops 0/0 in J and mu at standstill even though they are multiplied by zero", status: assumed}


# Pusher propeller, polynomial maps in J_p = V cos(alpha) / (n D).
pusher:
  D: {value: 457.2, unit: "mm", source: "APC 18x8E (assumed pusher propeller; 18 in, 8 in pitch)", status: assumed}
  I_p: {value: 0.0002, unit: "kg*m^2", source: "propeller + motor inertia", status: TBD}
  CT0: {value: 0.0826, unit: "-", source: "quadratic fit of APC 18x8E Ct(J), J 0-0.58, tables 6000-11000 rpm (APC computed prediction, ISA sea level); within 2% for J<=0.5", status: derived}
  CT1: {value: -0.0787, unit: "-", source: "same fit", status: derived}
  CT2: {value: -0.1112, unit: "-", source: "same fit", status: derived}
  CQ0: {value: 0.0052, unit: "-", source: "linear fit of APC Cp/(2 pi) vs J, J 0.1-0.55, tables 6000-11000 rpm; error about 8% at J 0.2-0.45, +13% at J 0.1; the model has no CQ2 term (Cp is concave in J)", status: derived}
  CQ1: {value: -0.00626, unit: "-", source: "same fit", status: derived}
  J_min: {value: 0.0, unit: "-", source: "APC tables start at J = 0 (no reverse-flow data)", status: derived}
  J_max: {value: 0.585, unit: "-", source: "end of the APC 18x8E tables (Ct crosses zero near J = 0.58); beyond this the coefficients are held", status: derived}
  omega_floor: {value: 1.0, unit: "rad/s", source: "NUMERICAL guard", status: assumed}


# Lift motor and ESC (one motor; all four assumed identical).
motor_lift:
  Ke: {value: 0.0796, unit: "V*s/rad", source: "60/(2 pi KV), KV = 120 (Vector Technics 8020 PRO datasheet); load-test regression 50-100% throttle gives 0.0795", status: datasheet}
  Kt: {value: 0.0796, unit: "N*m/A", source: "equals Ke in SI; torque vs current in the datasheet sweep gives 0.075-0.080 (the datasheet's Kt = 0.108 @ 3200 rpm does not match its own data)", status: derived}
  Rm: {value: 0.14, unit: "ohm", source: "2 x Rph (0.06) = 0.12 at 25 degC, x1.2 hot copper, plus ESC/wiring; sweep fit (Ke fixed) gives 0.13-0.15 over 50-100% throttle", status: derived}
  I0: {value: 3.0, unit: "A", source: "datasheet no-load current at 48 V (the sweep cannot resolve it: torque vs current gives 0 +/- a few A)", status: datasheet}
  I_lim: {value: 75, unit: "A", source: "datasheet maximum continuous current (180 s); 75 A was reached at 100% throttle in the VT3010 sweep (burst, not rated)", status: datasheet}
  dead_zone: {value: 0.05, unit: "-", source: "ESC dead-zone fraction of throttle; bench motor test", status: TBD}


# Pusher motor and ESC.
motor_pusher:
  Ke: {value: 0.0341, unit: "V*s/rad", source: "60/(2 pi KV), KV = 280 (Nipple 6220 spec sheet)", status: datasheet}
  Kt: {value: 0.0341, unit: "N*m/A", source: "equals Ke in SI (no torque measurement on the sheet)", status: derived}
  Rm: {value: 0.09, unit: "ohm", source: "EFFECTIVE series resistance fitted to the 48 V bench sweep (60-100% throttle, GF 18X8E); the sheet's internal resistance is 0.0192 ohm; includes ESC, wiring and duty compression; under-predicts current at 30-50% throttle", status: derived}
  I0: {value: 2.31, unit: "A", source: "sheet idle current at 10 V (about 2800 rpm); no-load current rises with rpm, so this is a lower bound at operating speed", status: datasheet}
  I_lim: {value: 107.9, unit: "A", source: "sheet max current at 100% throttle, 48 V, 2 min (copper 98 degC); ESC rated 120 A", status: datasheet}
  dead_zone: {value: 0.05, unit: "-", source: "ESC dead-zone fraction of throttle; bench motor test", status: TBD}


# Two packs in parallel through a PDB; equivalent-circuit model.
battery:
  n_parallel: {value: 2, unit: "-", source: "Y-connector to PDB (stated)", status: stated}
  cells_series: {value: 12, unit: "-", source: "MPower 12S (stated)", status: stated}
  R0_pack: {value: 12.0, unit: "mohm", source: "ONE pack, fresh, 25 degC, SoC>=30%: n_s*R0_cell/k = 12*5mohm/5 (placeholder LiPo preset scaled to 25 Ah; replace with HPPC)", status: assumed}
  R1_pack: {value: 7.2, unit: "mohm", source: "ONE pack: n_s*R1_cell/k = 12*3mohm/5 (placeholder preset; HPPC/GITT fit)", status: assumed}
  C1_pack: {value: 250.0, unit: "F", source: "ONE pack: k*C1_cell/n_s = 5*600F/12; tau = 1.8 s (placeholder preset; HPPC/GITT fit)", status: assumed}
  I_av: {value: 3.0, unit: "A", source: "120 W rated (5 V: 15+25 W, 12 V: 80 W) / (0.9 x 44 V); excludes servos and RF air unit", status: derived}
  V_min: {value: 33.0, unit: "V", source: "bus cut-off; battery-management limit (O-15)", status: TBD}
  capacity_Ah_pack: {value: 25.0, unit: "Ah", source: "MPower datasheet, per pack", status: datasheet}
  v_nominal: {value: 44.4, unit: "V", source: "MPower 12S datasheet", status: datasheet}

# Pitch-tracking surrogate (full rotational dynamics are out of scope).
attitude:
  omega_n: {value: 8.0, unit: "rad/s", source: "pitch-loop natural frequency; SITL or flight logs", status: TBD}
  zeta: {value: 0.8, unit: "-", source: "pitch-loop damping ratio", status: TBD}
  q_max: {value: 1.5, unit: "rad/s", source: "pitch-rate limit", status: TBD}
