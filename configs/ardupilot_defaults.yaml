# ArduPilot factory defaults of the parameters this study decides or assumes. REFERENCE ONLY
# (docs/DEFAULTS_spec.md): never a recommendation, never used as an input. Same format and status
# words as controller.yaml. Every entry was read from the ArduPilot source at tag Plane-4.7.2 on
# 2026-10-27. Names that no analysis decides (THR_SLEWRATE, the TECS_* group, PTCH_LIM_MIN_DEG) are
# not listed: their register values in controller.yaml already are the defaults.
#
# Two entries store a "use another parameter" value as ArduPilot does and are resolved by
# inputs.resolve_default: TKOFF_THR_MAX 0 means THR_MAX; Q_A_ANGLE_MAX is the attitude controller's
# ANGLE_MAX, whose default is 30 deg.

ardupilot:
  AIRSPEED_MIN:     {value: 9.0,    unit: "m/s",   source: "AIRSPEED_FBW_MIN 9 in ArduPlane/config.h (the default of AIRSPEED_MIN in Parameters.cpp), Plane-4.7.2; the same value as Plane-4.6.3", status: documented}
  Q_TRANSITION_MS:  {value: 5000.0, unit: "ms",   source: "quadplane.cpp AP_GROUPINFO TRANSITION_MS, Plane-4.7.2", status: documented}
  Q_TRAN_PIT_MAX:   {value: 3.0,    unit: "deg",  source: "quadplane.cpp AP_GROUPINFO TRAN_PIT_MAX, Plane-4.7.2", status: documented}
  TKOFF_THR_MAX:    {value: 0.0,    unit: "-",    source: "Parameters.cpp TKOFF_THR_MAX, Plane-4.7.2; 0 means THR_MAX is used (O-17)", status: documented}
  Q_BACKTRANS_MS:   {value: 3000.0, unit: "ms",   source: "quadplane.cpp AP_GROUPINFO BACKTRANS_MS, Plane-4.7.2", status: documented}
  Q_TRANS_DECEL:    {value: 2.0,    unit: "m/s^2", source: "quadplane.cpp AP_GROUPINFO TRANS_DECEL, Plane-4.7.2", status: documented}
  Q_BCK_PIT_LIM:    {value: 10.0,   unit: "deg",  source: "quadplane.cpp AP_GROUPINFO BCK_PIT_LIM, Plane-4.7.2", status: documented}
  Q_M_SPIN_MIN:     {value: 0.15,   unit: "-",    source: "AP_MOTORS_SPIN_MIN_DEFAULT in libraries/AP_Motors/AP_MotorsMulticopter.h, Plane-4.7.2", status: documented}
  Q_A_ANGLE_MAX:    {value: 30.0,   unit: "deg",  source: "ANGLE_MAX of AC_AttitudeControl (Q_A_ANGLE_MAX): AC_ATTITUDE_CONTROL_ANGLE_MAX_DEFAULT 30 deg, libraries/AC_AttitudeControl/AC_AttitudeControl.cpp, Plane-4.7.2", status: documented}
  Q_ASSIST_SPEED:   {value: 0.0,    unit: "m/s",  source: "quadplane.cpp AP_GROUPINFO ASSIST_SPEED (assist.speed), Plane-4.7.2; not modelled, listed for the table (O-20)", status: documented}
  TRIM_THROTTLE:    {value: 0.45,   unit: "-",    source: "AP_PLANE_TRIM_THROTTLE_DEFAULT 45 percent in ArduPlane/config.h (called THROTTLE_CRUISE before 4.7), Plane-4.7.2", status: documented}
  THR_MAX:          {value: 1.0,    unit: "-",    source: "THROTTLE_MAX 100 percent, ArduPlane/config.h, Plane-4.7.2", status: documented}
  THR_MIN:          {value: 0.0,    unit: "-",    source: "THROTTLE_MIN 0 percent, ArduPlane/config.h, Plane-4.7.2", status: documented}
